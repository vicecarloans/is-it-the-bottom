[project]
name = "is-it-the-bottom"
version = "0.1.0"
description = "Checks the five conditions that marked past stock market bottoms and gives a daily verdict."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "yfinance>=0.2.50",
]

[project.scripts]
bottom = "bottom.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bottom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
