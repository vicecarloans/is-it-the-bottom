# Thresholds and inputs for "Is it the bottom?".
# Every number here is a starting point from the design doc and can be tuned.

tickers:
  index: SPY
  sectors: [XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLB, XLU, XLRE, XLC]
  vix: "^VIX"

# How much daily history to load, in calendar days.
history_days: 760

# The drawdown window: conditions only matter when the S&P 500 is this far
# below its high over the lookback.
drawdown:
  lookback_days: 252      # trading days, about one year
  threshold_pct: -10

# Condition 1: VIX closed above the threshold within the lookback.
vix:
  threshold: 30
  lookback_days: 10       # trading days

# Condition 2: Fed not signaling hikes.
# 2-year Treasury yield minus the upper fed funds target must be at or below
# max_spread_pts, and the target must not have risen within hike_lookback_days.
fed:
  max_spread_pts: 0.10
  hike_lookback_days: 56  # calendar days, about one FOMC cycle

# Condition 3: margin debt deleveraging. Holds when either reading shows it.
margin:
  # FINRA margin debt: monthly, published about three weeks after the month ends.
  drop_pct: -10           # latest month vs its trailing high
  window_months: 12
  stale_after_days: 60    # from the end of the data month
  publication_lag_days: 21  # used only for past dates (backtests)
  # CFTC: leveraged funds' long plus short E-mini S&P 500 futures. Weekly, about
  # three days old. Shown on the page but not counted: the first live run showed
  # this rule tracks the quarterly futures cycle, not deleveraging. Set counts to
  # true only after a cycle-proof version is tested against data/cftc.json.
  funds:
    counts: false
    history_start: "2010-01-01"  # the weekly history saved to data/cftc.json
    drop_pct: -15         # 4-report average vs its trailing high
    average_reports: 4    # smooths the swing around quarterly contract expiry
    window_weeks: 26
    stale_after_days: 14  # from the Tuesday the positions were measured
    publication_lag_days: 3  # used only for past dates (backtests)

# Condition 4: a clear leading sector.
sector:
  return_window_days: 20  # trading days
  min_excess_pts: 5       # leader's return minus SPY's, in percentage points
  persistence_window: 15  # trading days
  persistence_min: 10     # days the leader must have been on top

# Condition 5: NVIDIA beats earnings during the panic.
nvda:
  symbol: NVDA
  recent_days: 90         # also counts any report since the drawdown began

# Systemic-break cap: either check caps the verdict at "Getting closer".
override:
  hy_window_days: 60      # trading days
  hy_widening_pts: 3      # high-yield spread rise from its low in the window
  # The news digest's systemic flag is the other check.

# Top-priority catalyst: an official filing naming Jensen Huang NVIDIA's CEO again.
catalyst:
  lookback_days: 60       # how far back to read NVIDIA's 8-K filings
  window_trading_days: 30 # how long the +1 level lasts after the filing
  watch_days: 14          # keep a news report of his return on the page this long after it was last seen

# The model used for the news digest and the filing check.
# News tags: each headline's likely effect on the market and on these lines.
# Context for the page only; they never set a condition or change the verdict.
news:
  lines:
    XLK: Technology
    XLF: Financials
    XLE: Energy
    XLV: Health care
    XLY: Consumer discretionary
    XLP: Consumer staples
    XLI: Industrials
    XLB: Materials
    XLU: Utilities
    XLRE: Real estate
    XLC: Communication services
    SMH: Semiconductors
    LAZR: Photonics             # Tema Photonics & Optical ETF
  # Two large companies per line; their recent news is added to the headlines.
  # NVIDIA news is already fetched on its own.
  companies:
    XLK: [AAPL, MSFT]
    XLF: [JPM, BAC]
    XLE: [XOM, CVX]
    XLV: [LLY, UNH]
    XLY: [AMZN, TSLA]
    XLP: [PG, COST]
    XLI: [GE, CAT]
    XLB: [LIN, SHW]
    XLU: [NEE, SO]
    XLRE: [PLD, AMT]
    XLC: [META, GOOGL]
    SMH: [AVGO, TSM]
    LAZR: [LITE, COHR]          # Lumentum, Coherent
  per_company: 4          # newest headlines kept per company
  batch_size: 40          # headlines per model call
  cache_days: 7           # reuse tags saved by runs in this many recent days
  # News scores: each story's direction x strength x confidence x novelty x kind, halving
  # every few trading days. Starting values, to be tuned once there is history.
  scoring:
    lookback_days: 21             # calendar days of saved headlines to read
    half_life_trading_days: 3
    reaction_threshold_pct: 0.5   # a move smaller than this, vs the S&P 500, is "muted"
    mild_at: 1.5                  # score for "positive" / "negative"
    strong_at: 4                  # score for "strongly positive" / "strongly negative"

llm:
  model: claude-haiku-5-5
