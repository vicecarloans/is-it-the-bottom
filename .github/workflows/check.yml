name: Check

# Runs `bottom check` against live data using the repository secrets and prints
# the checklist in the job log. Milestone 2 replaces this with the daily job.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bottom/**"
      - "config.yaml"
      - "uv.lock"
      - ".github/workflows/check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Run bottom check
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: uv run bottom check | tee checklist.txt
      - name: Add the checklist to the run summary
        run: |
          {
            echo '```'
            cat checklist.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: data/raw/
          retention-days: 14
