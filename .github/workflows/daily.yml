name: Daily

# Runs the checks twice on weekdays, at 9:00 am (before the open) and 5:00 pm (after
# the close) New York time, then commits the data files. The page reads them from the
# repo, so no redeploy is needed. Also runs when the code, the config or the FINRA
# spreadsheet changes on main.
#
# GitHub schedules are in UTC and New York moves between UTC-5 and UTC-4, so each time
# is listed for both offsets and the gate job drops the one that does not match today.

on:
  schedule:
    - cron: "0 14 * * 1-5"  # 9:00 am New York in winter (UTC-5)
    - cron: "0 13 * * 1-5"  # 9:00 am New York in summer (UTC-4)
    - cron: "0 22 * * 1-5"  # 5:00 pm New York in winter
    - cron: "0 21 * * 1-5"  # 5:00 pm New York in summer
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bottom/**"
      - "config.yaml"
      - "uv.lock"
      - "data/finra/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          go=true
          if [ -n "$CRON" ]; then
            hour=$(echo "$CRON" | awk '{print $2}')
            offset=$(TZ=America/New_York date +%z)  # -0500 in winter, -0400 in summer
            case "$offset:$hour" in
              -0500:14|-0500:22|-0400:13|-0400:21) ;;
              *) go=false; echo "Skipping: $CRON is for the other UTC offset." ;;
            esac
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked

      - name: Run the checks
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -o pipefail  # so a refused run fails the job instead of being hidden by tee
          uv run bottom run --out data | tee checklist.txt

      - name: Add the checklist to the run summary
        run: |
          {
            echo '```'
            cat checklist.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/catalyst.json data/cftc.json data/days
          if git diff --cached --quiet; then
            echo "No change in the data."
            exit 0
          fi
          git commit -m "Update data for $(jq -r .as_of data/latest.json)"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          echo "Could not push the data after 3 attempts." >&2
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-data
          path: data/raw/
          retention-days: 14
          if-no-files-found: ignore
